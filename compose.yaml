services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?thieu_trong_env}
      MYSQL_DATABASE: club_db
      MYSQL_USER: club_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?thieu_trong_env}
    volumes:
      - club_db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?thieu_trong_env}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - club_net

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_NAME: club_db
      DB_USER: club_user
      DB_PASSWORD: ${DB_PASSWORD:?thieu_trong_env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - club_net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - club_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app
    networks:
      - club_net


  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?thieu_trong_env}
    volumes:
      - club_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - club_net

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - club_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - club_net

  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - club_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    depends_on:
      - nginx
    networks:
      - club_net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/mysqld.cnf"
    volumes:
      - ./monitoring/mysqld.cnf:/etc/mysqld.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - club_net

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./logging/loki.yaml:/etc/loki/loki.yaml:ro
      - club_loki_data:/loki
    networks:
      - club_net

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./logging/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - club_promtail_positions:/positions
    depends_on:
      - loki
    networks:
      - club_net

volumes:
  club_db_data:
  club_grafana_data:
  club_prometheus_data:
  club_loki_data:
  club_promtail_positions:

networks:
  club_net:
